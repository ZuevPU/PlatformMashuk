# Продакшн-стек «Центр знаний «Машук»».
#
# Приложение + PostgreSQL + Caddy (TLS) + наблюдаемость (Prometheus/Grafana).
# Трекер ошибок GlitchTip — отдельным файлом deploy/glitchtip/docker-compose.yml
# (тяжёлый для VPS 4 ГБ, включается по необходимости).
#
# Запуск:  docker compose up -d
# Миграции: docker compose --profile tools run --rm tools pnpm db:migrate
# Сидинг:   docker compose --profile tools run --rm tools pnpm db:seed
#
# Переменные берутся из файла .env рядом с этим файлом
# (см. deploy/.env.production.example).

name: mashuk

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mashuk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-mashuk_platform}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mashuk} -d ${POSTGRES_DB:-mashuk_platform}"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 768m
    logging: *logging

  app:
    image: ${APP_IMAGE:-ghcr.io/zuevpu/platformmashuk:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4321"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-mashuk}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mashuk_platform}
      SENTRY_DSN: ${SENTRY_DSN:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-ru-central1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      # Ключ для обезличенных ответов в опросах: задайте один раз и не меняйте
      AUTH_SECRET: ${AUTH_SECRET:-}
      STORAGE_DIR: /app/storage
    volumes:
      - uploads:/app/public/uploads
      # Авторские сборки программ: закрыты от посторонних, переживают обновления
      - storage:/app/storage
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4321/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1024m
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в .env}
      ACME_EMAIL: ${ACME_EMAIL:?задайте ACME_EMAIL в .env}
      # Заполняется только если используете GlitchTip (deploy/glitchtip)
      ERRORS_DOMAIN: ${ERRORS_DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 160m
    logging: *logging

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    mem_limit: 64m
    logging: *logging

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    depends_on:
      - node-exporter
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    mem_limit: 512m
    logging: *logging

  grafana:
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?задайте GF_SECURITY_ADMIN_PASSWORD в .env}
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    mem_limit: 384m
    logging: *logging

  # Одноразовые команды: миграции и сидинг (профиль tools)
  tools:
    image: ${TOOLS_IMAGE:-ghcr.io/zuevpu/platformmashuk-tools:latest}
    build:
      context: .
      dockerfile: deploy/Dockerfile.tools
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Сид на рабочем сервере откажется очищать базу без SEED_FORCE=1
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-mashuk}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mashuk_platform}
    mem_limit: 1024m
    logging: *logging

volumes:
  pg_data:
  uploads:
  storage:
  caddy_data:
  caddy_config:
  prom_data:
  grafana_data:
